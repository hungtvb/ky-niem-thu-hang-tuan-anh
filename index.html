  <p>Giữa triệu người, tìm thấy nhau đã là duyên lớn. Giữ được nhau qua bao năm tháng mới là phúc phần.</p>
  <p>Chúc hai bạn mãi như hai ánh sáng — đi đâu cũng tìm về bên nhau, và năm nào cũng ngọt ngào như năm đầu tiên.</p>
